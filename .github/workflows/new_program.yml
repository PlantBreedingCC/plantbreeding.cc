name: Add New Breeding Program

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  
jobs:
  add_program:
    if: contains(github.event.issue.labels.*.name, 'program') && github.event.comment.user.login == 'trife' && contains(github.event.comment.body, 'approved')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract issue data and update CSV
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Get the issue body
          const issueBody = context.payload.issue.body;
          console.log('Issue body:', issueBody);
          
          // Parse the form data using regex patterns
          const extractField = (fieldName, body) => {
            const pattern = new RegExp(`### ${fieldName}\\s*([\\s\\S]*?)(?=###|$)`, 'i');
            const match = body.match(pattern);
            return match ? match[1].trim() : '';
          };
          
          // Extract form fields
          const state = extractField('State', issueBody);
          const crop_general = extractField('Crop', issueBody);
          const name = extractField('Name', issueBody);
          const organization = extractField('Organization', issueBody);
          
          console.log('Extracted data:', { state, crop_general, name, organization });
          
          // Validate required fields
          if (!state || !crop_general || !name || !organization) {
            throw new Error('Missing required fields in issue');
          }
          
          // Convert state name to abbreviation
          const stateMap = {
            'Alabama': 'AL', 'Alaska': 'AK', 'Arizona': 'AZ', 'Arkansas': 'AR', 'California': 'CA',
            'Colorado': 'CO', 'Connecticut': 'CT', 'Delaware': 'DE', 'Florida': 'FL', 'Georgia': 'GA',
            'Hawaii': 'HI', 'Idaho': 'ID', 'Illinois': 'IL', 'Indiana': 'IN', 'Iowa': 'IA',
            'Kansas': 'KS', 'Kentucky': 'KY', 'Louisiana': 'LA', 'Maine': 'ME', 'Maryland': 'MD',
            'Massachusetts': 'MA', 'Michigan': 'MI', 'Minnesota': 'MN', 'Mississippi': 'MS', 'Missouri': 'MO',
            'Montana': 'MT', 'Nebraska': 'NE', 'Nevada': 'NV', 'New Hampshire': 'NH', 'New Jersey': 'NJ',
            'New Mexico': 'NM', 'New York': 'NY', 'North Carolina': 'NC', 'North Dakota': 'ND', 'Ohio': 'OH',
            'Oklahoma': 'OK', 'Oregon': 'OR', 'Pennsylvania': 'PA', 'Rhode Island': 'RI', 'South Carolina': 'SC',
            'South Dakota': 'SD', 'Tennessee': 'TN', 'Texas': 'TX', 'Utah': 'UT', 'Vermont': 'VT',
            'Virginia': 'VA', 'Washington': 'WA', 'West Virginia': 'WV', 'Wisconsin': 'WI', 'Wyoming': 'WY'
          };
          
          const stateAbbr = stateMap[state] || state;
          
          // Read the existing CSV file
          const csvPath = 'assets/data/breeding-programs.csv';
          let csvContent = fs.readFileSync(csvPath, 'utf8');
          
          // Create new row (matching the CSV structure: state,crop_general,crop_specific,Name,Org,State)
          const newRow = `${stateAbbr},${crop_general},,${name},${organization},${state}`;
          
          // Ensure the CSV content ends with a newline, then append the new row
          if (!csvContent.endsWith('\n')) {
            csvContent += '\n';
          }
          csvContent += newRow + '\n';
          
          // Write back to file
          fs.writeFileSync(csvPath, csvContent);
          
          console.log('Successfully added new row to CSV:', newRow);
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add assets/data/breeding-programs.csv
        git commit -m "Add new breeding program: ${{ github.event.issue.title }}"
        git push
    
    - name: Close issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          });
          
          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: '✅ Breeding program has been successfully added to the database and the map has been updated!'
          });
