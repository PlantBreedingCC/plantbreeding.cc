name: new-research-article

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ── Step 1: Gate on label + keyword, then verify commenter is an admin ──────
  check_permission:
    if: >
      contains(github.event.issue.labels.*.name, 'research') &&
      contains(github.event.comment.body, 'approved')
    runs-on: ubuntu-latest
    outputs:
      is_admin: ${{ steps.check.outputs.is_admin }}
    steps:
      - name: Check commenter permission
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const { data: permData } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter
            });
            const isAdmin = permData.permission === 'admin';
            core.setOutput('is_admin', isAdmin.toString());
            if (!isAdmin) {
              console.log(
                `User ${commenter} has permission '${permData.permission}', ` +
                `not 'admin'. Skipping workflow.`
              );
            }

  # ── Step 2: Extract data, build files, open PR ───────────────────────────────
  create_research_pr:
    needs: check_permission
    if: needs.check_permission.outputs.is_admin == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Parse & validate the issue form fields ─────────────────────────────
      - name: Extract and validate issue data
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;

            const extractField = (fieldName, body) => {
              const pattern = new RegExp(
                `### ${fieldName}\\s*([\\s\\S]*?)(?=###|$)`, 'i'
              );
              const match = body.match(pattern);
              return match ? match[1].trim() : '';
            };

            const title      = extractField('Article Title',   issueBody);
            const date       = extractField('Publication Date', issueBody);
            const identifier = extractField('File Identifier',  issueBody);
            const pdfRaw     = extractField('PDF File',         issueBody);
            const summary    = extractField('Summary',          issueBody);

            // ── Parse GitHub CDN URL from the drag-and-drop markdown link ─
            // GitHub inserts text like: [filename.pdf](https://github.com/user-attachments/files/...)
            let pdfUrl = '';
            if (pdfRaw) {
              const urlMatch = pdfRaw.match(/\(https:\/\/github\.com\/user-attachments\/files\/[^)]+\)/);
              if (urlMatch) {
                pdfUrl = urlMatch[0].slice(1, -1); // strip surrounding parens
              }
            }

            // ── Required fields ───────────────────────────────────────────
            if (!title || !date || !identifier || !summary) {
              core.setFailed('One or more required fields are missing from the issue.');
              return;
            }

            if (!pdfUrl) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ No PDF attachment was found in the **PDF File** field. ' +
                      'Please edit the issue, drag and drop the PDF into that field, and resubmit for approval.'
              });
              core.setFailed('No GitHub CDN PDF URL found in the PDF File field.');
              return;
            }

            // ── Summary length ────────────────────────────────────────────
            if (summary.length > 400) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ The summary is **${summary.length} characters**, which exceeds the 400-character limit. ` +
                      `Please edit the issue and resubmit for approval.`
              });
              core.setFailed(`Summary is ${summary.length} chars, exceeds 400 limit.`);
              return;
            }

            // ── Date format ───────────────────────────────────────────────
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ The date \`${date}\` is not in \`YYYY-MM-DD\` format. ` +
                      `Please edit the issue and resubmit for approval.`
              });
              core.setFailed(`Invalid date format: ${date}`);
              return;
            }

            // ── Identifier format ─────────────────────────────────────────
            if (!/^[a-z0-9-]+$/.test(identifier)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ The file identifier \`${identifier}\` contains invalid characters. ` +
                      `Use only lowercase letters, numbers, and hyphens. Please edit the issue and resubmit.`
              });
              core.setFailed(`Invalid identifier: ${identifier}`);
              return;
            }

            // ── Build filename ─────────────────────────────────────────────
            const [yyyy, mm] = date.split('-');
            const filename = `${yyyy}-${mm}-${identifier}`;

            core.setOutput('title',      title);
            core.setOutput('date',       date);
            core.setOutput('identifier', identifier);
            core.setOutput('pdf_url',    pdfUrl);
            core.setOutput('summary',    summary);
            core.setOutput('filename',   filename);

      # ── Install PDF conversion tools ───────────────────────────────────────
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils imagemagick

      # ── Download the PDF ───────────────────────────────────────────────────
      - name: Download PDF
        env:
          PDF_URL:  ${{ steps.extract.outputs.pdf_url }}
          FILENAME: ${{ steps.extract.outputs.filename }}
        run: |
          mkdir -p assets/research
          curl -L --fail --max-filesize 52428800 \
            --output "assets/research/${FILENAME}.pdf" \
            "${PDF_URL}"
          echo "PDF saved → assets/research/${FILENAME}.pdf"

      # ── Render first-page thumbnail (max height 1000 px) ──────────────────
      - name: Generate thumbnail
        env:
          FILENAME: ${{ steps.extract.outputs.filename }}
        run: |
          mkdir -p assets/images/research

          # Render the first page of the PDF to a PNG at 150 DPI
          pdftoppm \
            -f 1 -l 1 \
            -png -r 150 \
            "assets/research/${FILENAME}.pdf" \
            "/tmp/${FILENAME}"

          # pdftoppm appends a page-number suffix (e.g. -1 or -01)
          FIRST_PAGE=$(ls /tmp/${FILENAME}*.png | sort | head -1)
          echo "Rendered page: ${FIRST_PAGE}"

          # Resize so height ≤ 1000 px; only downscale, preserve aspect ratio
          convert "${FIRST_PAGE}" \
            -resize 'x1000>' \
            "assets/images/research/${FILENAME}.png"

          echo "Thumbnail saved → assets/images/research/${FILENAME}.png"

      # ── Write the Markdown article ─────────────────────────────────────────
      - name: Create markdown file
        env:
          TITLE:      ${{ steps.extract.outputs.title }}
          DATE:       ${{ steps.extract.outputs.date }}
          FILENAME:   ${{ steps.extract.outputs.filename }}
          IDENTIFIER: ${{ steps.extract.outputs.identifier }}
          SUMMARY:    ${{ steps.extract.outputs.summary }}
        run: |
          mkdir -p _research
          python3 - <<'PYEOF'
          import os

          title      = os.environ['TITLE']
          date       = os.environ['DATE']
          filename   = os.environ['FILENAME']
          identifier = os.environ['IDENTIFIER']
          summary    = os.environ['SUMMARY']

          content = (
              "---\n"
              f"layout: article\n"
              f"title: {title}\n"
              f"date: {date}\n"
              f"pdf: /assets/research/{filename}.pdf\n"
              f"key: research-{identifier}\n"
              f"cover: /assets/images/research/{filename}.png\n"
              "---\n\n"
              f"{summary}\n"
          )

          out_path = f"_research/{filename}.md"
          with open(out_path, 'w') as f:
              f.write(content)

          print(f"Markdown written → {out_path}")
          print("--- Content preview ---")
          print(content)
          PYEOF

      # ── Push files to a new branch and open a PR ──────────────────────────
      - name: Create branch and open pull request
        id: create_pr
        uses: actions/github-script@v7
        env:
          FILENAME: ${{ steps.extract.outputs.filename }}
          TITLE:    ${{ steps.extract.outputs.title }}
        with:
          script: |
            const fs   = require('fs');
            const filename    = process.env.FILENAME;
            const title       = process.env.TITLE;
            const issueNumber = context.issue.number;

            const branchName = `research/issue-${issueNumber}-${filename}`;

            // Resolve target (default) branch
            const { data: repoData } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo:  context.repo.repo
            });
            const defaultBranch = repoData.default_branch;

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `heads/${defaultBranch}`
            });

            // Create the feature branch
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/heads/${branchName}`,
              sha:   ref.object.sha
            });
            console.log(`Created branch: ${branchName}`);

            // Helper: push a local file to the branch via the Contents API
            async function pushFile(repoPath, localPath) {
              const rawContent = fs.readFileSync(localPath);
              const base64     = rawContent.toString('base64');

              let existingSha;
              try {
                const { data: existing } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  path:  repoPath,
                  ref:   branchName
                });
                existingSha = existing.sha;
              } catch (_) {
                // File is new – no SHA needed
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                path:    repoPath,
                message: `Add research article: ${title}`,
                content: base64,
                branch:  branchName,
                ...(existingSha ? { sha: existingSha } : {})
              });
              console.log(`Pushed: ${repoPath}`);
            }

            // Push all three artefacts
            await pushFile(
              `_research/${filename}.md`,
              `_research/${filename}.md`
            );
            await pushFile(
              `assets/research/${filename}.pdf`,
              `assets/research/${filename}.pdf`
            );
            await pushFile(
              `assets/images/research/${filename}.png`,
              `assets/images/research/${filename}.png`
            );

            // Open the pull request
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Add research article: ${title}`,
              body: [
                `Closes #${issueNumber}`,
                '',
                `This PR adds the research article **${title}**, approved in issue #${issueNumber}.`,
                '',
                '| File | Path |',
                '|------|------|',
                `| Markdown | \`_research/${filename}.md\` |`,
                `| PDF | \`assets/research/${filename}.pdf\` |`,
                `| Thumbnail | \`assets/images/research/${filename}.png\` |`
              ].join('\n'),
              head: branchName,
              base: defaultBranch
            });

            console.log(`Pull request created: ${pr.html_url}`);
            core.setOutput('pr_url',    pr.html_url);
            core.setOutput('pr_number', pr.number.toString());

      # ── Leave a comment on the issue linking the new PR ────────────────────
      - name: Comment on issue with PR link
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl    = '${{ steps.create_pr.outputs.pr_url }}';
            const prNumber = '${{ steps.create_pr.outputs.pr_number }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '✅ Approved! The research article, PDF, and auto-generated thumbnail have been bundled into a pull request.',
                '',
                `➡️ **PR #${prNumber}:** ${prUrl}`,
                '',
                'Merge the PR to publish the article to the website.'
              ].join('\n')
            });
